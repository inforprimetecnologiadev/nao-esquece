name: Testar no emulador Android

# Liga um Android 14 de verdade (emulador) e roda os testes do alarme, do aviso e do calendário.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Liberar a aceleração (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Baixar e conferir o LAME (MP3)
        run: bash .github/lame.sh

      - name: Compilar o app e os testes
        run: |
          NDK=$(basename "${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}")
          echo "NDK: $NDK"
          gradle -p android assembleDebug assembleDebugAndroidTest --no-daemon -PndkVer="$NDK"

      - name: Rodar no Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/emulador.sh

      - name: Guardar prints e relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulador
          path: out/

      - name: Publicar o resultado no ramo emulador-resultado
        if: always()
        run: |
          [ -d out ] || exit 0
          cd out
          git init -q -b emulador-resultado
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Resultado de ${GITHUB_SHA::7}" || exit 0
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" emulador-resultado
