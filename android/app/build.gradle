plugins {
    id 'com.android.application'
}

// App nativo: as telas rodam dentro do próprio app (WebView do Android), sem abrir o Chrome.
android {
    namespace 'com.inforprime.naoesquece'
    compileSdk 34
    // NDK do próprio servidor de compilação (o GitHub passa -PndkVer); o MP3 (LAME) é compilado em C
    if (project.hasProperty('ndkVer')) ndkVersion project.property('ndkVer')

    defaultConfig {
        applicationId 'com.inforprime.naoesquece'
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName '1.7.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    buildFeatures {
        buildConfig true
    }

    // A chave de assinatura não fica no GitHub: aqui o APK sai sem assinatura e é assinado à parte.
    def ks = rootProject.file('release.keystore')
    if (ks.exists()) {
        signingConfigs {
            release {
                storeFile ks
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ks.exists()) signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    // scanner de documentos do Google (recorta, endireita e gera o PDF)
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0-beta1'
    // ler o texto das fotos e dos PDFs no próprio celular (modelo dentro do app: funciona sem internet)
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    // testes no emulador (alarme, aviso, calendário)
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'junit:junit:4.13.2'
}
