plugins {
    id 'com.android.application'
}

// App nativo: as telas rodam dentro do próprio app (WebView do Android), sem abrir o Chrome.
android {
    namespace 'com.inforprime.naoesquece'
    compileSdk 34

    defaultConfig {
        applicationId 'com.inforprime.naoesquece'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '1.3.0'
    }

    buildFeatures {
        buildConfig true
    }

    // A chave de assinatura não fica no GitHub: aqui o APK sai sem assinatura e é assinado à parte.
    def ks = rootProject.file('release.keystore')
    if (ks.exists()) {
        signingConfigs {
            release {
                storeFile ks
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ks.exists()) signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
}
